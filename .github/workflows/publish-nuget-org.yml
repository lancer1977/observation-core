name: Publish NuGet.org

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without a leading v
        type: string
        required: true
        default: 0.1.0-preview.3
      publish:
        description: Publish the package to nuget.org
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: observation-core-publish-nuget-org-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $INPUT_VERSION" >&2
            exit 1
          fi
          project_version="$(dotnet msbuild src/Observation.Core/Observation.Core.csproj -getProperty:PackageVersion -p:Configuration=Release -nologo | tail -n 1)"
          if [[ "$INPUT_VERSION" != "$project_version" ]]; then
            echo "Input version $INPUT_VERSION does not match project version $project_version" >&2
            exit 1
          fi
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore ObservationCore.slnx

      - name: Build
        run: dotnet build ObservationCore.slnx -c Release --no-restore

      - name: Test
        run: dotnet test ObservationCore.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/Observation.Core/Observation.Core.csproj -c Release --no-build -o artifacts/packages -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Inspect package
        run: |
          set -euo pipefail
          package=(artifacts/packages/*.nupkg)
          test "${#package[@]}" -eq 1
          unzip -t "${package[0]}"
          unzip -p "${package[0]}" Observation.Core.nuspec > package.nuspec
          grep -F '<id>Observation.Core</id>' package.nuspec
          grep -F '<version>${{ steps.version.outputs.version }}</version>' package.nuspec
          grep -F '<readme>README.md</readme>' package.nuspec
          unzip -l "${package[0]}" | grep -F 'README.md'

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish == true && github.ref == 'refs/heads/main' }}
    needs: package
    runs-on: ubuntu-latest
    environment: nuget-org
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1

      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-${{ inputs.version }}
          path: artifacts/packages

      - name: Publish to nuget.org
        env:
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NUGET_ORG_API_KEY"
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_ORG_API_KEY"
          done
